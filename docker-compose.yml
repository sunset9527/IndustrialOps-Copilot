name: industrialops

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: industrialops
      MYSQL_USER: industrialops
      MYSQL_PASSWORD: "${INDUSTRIALOPS_DB_PASSWORD:?Set INDUSTRIALOPS_DB_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${INDUSTRIALOPS_DB_ROOT_PASSWORD:?Set INDUSTRIALOPS_DB_ROOT_PASSWORD in .env}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uindustrialops -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "industrialops.bootstrap"]
    environment: &api-environment
      INDUSTRIALOPS_DATABASE_URL: "mysql+pymysql://industrialops:${INDUSTRIALOPS_DB_PASSWORD:?Set INDUSTRIALOPS_DB_PASSWORD in .env}@db:3306/industrialops"
      INDUSTRIALOPS_PROJECT_ROOT: /app
      INDUSTRIALOPS_OFFLINE: "${INDUSTRIALOPS_OFFLINE:-true}"
      INDUSTRIALOPS_PACKS_ROOT: /local/packs
      INDUSTRIALOPS_PACK_REGISTRY_PATH: /app/config/equipment_pack_registry_v1.json
      INDUSTRIALOPS_INDEXES_ROOT: /app/data/indexes
      INDUSTRIALOPS_BGE_MODEL_PATH: /local/models/bge-m3
      INDUSTRIALOPS_RERANKER_MODEL_PATH: /local/models/reranker
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
    volumes:
      - "${INDUSTRIALOPS_PACKS_PATH:?Set INDUSTRIALOPS_PACKS_PATH in .env}:/local/packs:ro"
      - "${INDUSTRIALOPS_BGE_MODEL_PATH:?Set INDUSTRIALOPS_BGE_MODEL_PATH in .env}:/local/models/bge-m3:ro"
      - "${INDUSTRIALOPS_RERANKER_MODEL_PATH:?Set INDUSTRIALOPS_RERANKER_MODEL_PATH in .env}:/local/models/reranker:ro"
      - index-data:/app/data/indexes
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-environment
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - "${INDUSTRIALOPS_PACKS_PATH:?Set INDUSTRIALOPS_PACKS_PATH in .env}:/local/packs:ro"
      - "${INDUSTRIALOPS_BGE_MODEL_PATH:?Set INDUSTRIALOPS_BGE_MODEL_PATH in .env}:/local/models/bge-m3:ro"
      - "${INDUSTRIALOPS_RERANKER_MODEL_PATH:?Set INDUSTRIALOPS_RERANKER_MODEL_PATH in .env}:/local/models/reranker:ro"
      - index-data:/app/data/indexes
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8100/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-data:
  index-data:
