[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "industrialops-copilot"
version = "0.1.0"
description = "Reusable platform foundation for IndustrialOps Copilot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=4.2.1,<5",
    "fastapi>=0.135.3,<1",
    "passlib==1.7.4",
    "PyMySQL>=1.1,<2",
    "pypdf>=6.12,<7",
    "python-docx>=1.2,<2",
    "SQLAlchemy>=2.0.36,<2.1",
    "uvicorn>=0.41,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28.1,<1", "pytest>=8.3,<10", "PyYAML>=6.0.2,<7"]
local-models = ["langchain-community>=0.4,<1", "numpy>=2,<3", "sentence-transformers>=3,<6", "torch>=2,<3", "transformers>=4.45,<6"]

[tool.setuptools]
package-dir = {"" = "src", api = "api"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["industrialops", "industrialops.*", "api"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=tmp/pytest-run"
